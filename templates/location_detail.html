{% extends 'base.html' %}
{% block content %}

<main class="mx-auto max-w-[40rem]   px-5 pb-10 pt-6 font-sans text-[#17261b]">

    <a href="{% url 'show_location' %}"
       class="mb-6 inline-flex items-center gap-1.5 text-sm font-bold text-[#2e7d32] hover:text-[#1f5a23]">
        Kembali ke peta
    </a>

    <div class="flex flex-wrap items-start justify-between gap-3">
        <h1 class="text-[1.6rem] font-extrabold leading-tight tracking-[-0.02em] text-[#1a2e1c]">
            {{ loc.name }}
        </h1>
        <span class="whitespace-nowrap rounded-full bg-[#e8f5e9] px-3 py-[3px] text-xs font-bold text-[#2e7d32]">
            {{ loc.get_category_display }}
        </span>
    </div>

    {% if loc.description %}
    <p class="mt-3 text-[0.95rem] leading-relaxed text-[#5f6f64]">{{ loc.description }}</p>
    {% endif %}

    <dl class="mt-6 divide-y divide-[#dfe5e0] border-y border-[#dfe5e0] text-[0.9rem]">
        <div class="flex flex-wrap gap-x-4 gap-y-1 py-3.5">
            <dt class="w-28 shrink-0 font-semibold text-[#5f6f64]">Alamat : </dt>
            <dd class="min-w-0 flex-1 font-semibold">{{ loc.address }}</dd>
        </div>
        <div class="flex flex-wrap gap-x-4 gap-y-1 py-3.5">
            <dt class="w-28 shrink-0 font-semibold text-[#5f6f64]">Kota : </dt>
            <dd class="min-w-0 flex-1 font-semibold">{{ loc.city }}</dd>
        </div>
        <div class="flex flex-wrap gap-x-4 gap-y-1 py-3.5">
            <dt class="w-28 shrink-0 font-semibold text-[#5f6f64]">Jam buka : </dt>
            <dd class="min-w-0 flex-1 font-semibold text-[#2e7d32]">{{ loc.open_hours }}</dd>
        </div>
    </dl>
</main>
{% endblock content %}
