{% extends 'base.html' %}
{% block content %}
    <main>
        Landing Page
        <a href="{% url 'show_location' %}">Lokasi</a>
        <form method="post" action="{% url 'create_location' %}">
            {% csrf_token %}
            {% for field in form %}
                <label for="{{ field.id_for_label }}"> {{ field.label }}</label>
                {{ field }}
                {% for error in field.errors %}
                    <p> {{ error }}</p>
                {% endfor %}
            {% endfor %}
            <button type="submit">Tambah lokasi</button>
            <a href="{% url 'show_location' %}">Batal</a>
        </form>
    </main>
{% endblock content %}
