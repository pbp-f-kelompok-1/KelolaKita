{% extends 'base.html' %}
{% block content %}

<main class="mx-auto max-w-[40rem]   px-5 pb-10 pt-6 font-sans text-ink">

    <a href="{% url 'show_location' %}"
       class="mb-6 inline-flex items-center gap-1.5 text-sm font-bold text-lime hover:text-lime">
        Kembali ke peta
    </a>

    <div class="flex flex-wrap items-start justify-between gap-3">
        <h1 class="text-[1.6rem] font-extrabold leading-tight tracking-[-0.02em] text-ink">
            {{ loc.name }}
        </h1>
        <span class="whitespace-nowrap rounded-full bg-raised px-3 py-[3px] text-xs font-bold text-lime">
            {{ loc.get_category_display }}
        </span>
    </div>

    {% if loc.description %}
    <p class="mt-3 text-[0.95rem] leading-relaxed text-muted">{{ loc.description }}</p>
    {% endif %}

    <dl class="mt-6 divide-y divide-line border-y border-line text-[0.9rem]">
        <div class="flex flex-wrap gap-x-4 gap-y-1 py-3.5">
            <dt class="w-28 shrink-0 font-semibold text-muted">Alamat : </dt>
            <dd class="min-w-0 flex-1 font-semibold">{{ loc.address }}</dd>
        </div>
        <div class="flex flex-wrap gap-x-4 gap-y-1 py-3.5">
            <dt class="w-28 shrink-0 font-semibold text-muted">Kota : </dt>
            <dd class="min-w-0 flex-1 font-semibold">{{ loc.city }}</dd>
        </div>
        <div class="flex flex-wrap gap-x-4 gap-y-1 py-3.5">
            <dt class="w-28 shrink-0 font-semibold text-muted">Jam buka : </dt>
            <dd class="min-w-0 flex-1 font-semibold text-lime">{{ loc.open_hours }}</dd>
        </div>
    </dl>
</main>
{% endblock content %}
